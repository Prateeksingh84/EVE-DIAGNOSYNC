<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020b18"/>
      <stop offset="40%"  stop-color="#0a3d62"/>
      <stop offset="100%" stop-color="#020b18"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00bfff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00bfff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)"/>

  <!-- Animated wave bottom -->
  <path fill="#00bfff" fill-opacity="0.06">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,160 C150,120 300,200 450,160 C600,120 750,200 900,160 L900,220 L0,220 Z;
              M0,180 C150,140 300,180 450,140 C600,100 750,180 900,140 L900,220 L0,220 Z;
              M0,160 C150,120 300,200 450,160 C600,120 750,200 900,160 L900,220 L0,220 Z"/>
  </path>
  <path fill="#009688" fill-opacity="0.05">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,180 C200,150 400,200 600,170 C750,145 850,190 900,175 L900,220 L0,220 Z;
              M0,170 C200,200 400,155 600,185 C750,210 850,160 900,190 L900,220 L0,220 Z;
              M0,180 C200,150 400,200 600,170 C750,145 850,190 900,175 L900,220 L0,220 Z"/>
  </path>

  <!-- Top accent line animated -->
  <rect x="0" y="0" width="900" height="2" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Pulse circles background decoration -->
  <circle cx="80" cy="110" r="60" fill="#00bfff" fill-opacity="0.03">
    <animate attributeName="r" values="50;70;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.03;0.07;0.03" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="110" r="60" fill="#009688" fill-opacity="0.03">
    <animate attributeName="r" values="50;70;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.03;0.06;0.03" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Medical cross icon with pulse -->
  <g transform="translate(50,85)" filter="url(#glow)">
    <circle cx="0" cy="0" r="22" fill="#00bfff" fill-opacity="0.15">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text font-size="26" text-anchor="middle" dominant-baseline="central" fill="#00bfff">⚕</text>
  </g>

  <!-- MAIN TITLE with fade-in animation -->
  <text x="460" y="95"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="800"
        text-anchor="middle"
        fill="#ffffff"
        filter="url(#glow2)"
        letter-spacing="1">
    <animate attributeName="opacity" values="0;0;1" dur="1.2s" fill="freeze"/>
    Eve DiagnoSync
  </text>

  <!-- Cyan underline accent animated -->
  <rect x="200" y="108" width="500" height="3" rx="2" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;500" dur="1.5s" fill="freeze"/>
    <animate attributeName="x" values="450;200" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- Subtitle -->
  <text x="460" y="145"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="16" font-weight="400"
        text-anchor="middle"
        fill="#a0d8ef"
        opacity="0">
    <animate attributeName="opacity" values="0;0;0;1" dur="2s" fill="freeze"/>
    Distributed Diagnostic Booking &amp; Settlement Platform
  </text>

  <!-- Tech stack line -->
  <text x="460" y="178"
        font-family="'Courier New', monospace"
        font-size="12"
        text-anchor="middle"
        fill="#00bfff"
        opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1" dur="2.5s" fill="freeze"/>
    FastAPI  ·  SQLAlchemy 2.0  ·  PostgreSQL  ·  Redis  ·  Celery  ·  ReportLab
  </text>

</svg>